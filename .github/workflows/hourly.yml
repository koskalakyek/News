name: Hourly News Agent

on:
  schedule:
    # هر ساعت، دقیقه صفر (UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions

permissions:
  contents: write   # برای commit کردن seen_links.json به‌روزشده

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit updated seen_links.json
        run: |
          git config user.name "news-agent-bot"
          git config user.email "actions@github.com"
          git add seen_links.json
          git diff --staged --quiet || git commit -m "update seen links [skip ci]"
          git push
